<style>
  :root {
    --bg: #0a0a0f;
    --card: rgba(255,255,255,0.045);
    --card-border: rgba(255,255,255,0.09);
    --text: #f4f2f7;
    --dim: #8f8a9b;
    --accent: #ffd9a8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,214,165,0.10), transparent 60%),
      radial-gradient(900px 500px at 85% 110%, rgba(140,110,255,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(28px, env(safe-area-inset-top)) 26px max(24px, env(safe-area-inset-bottom));
    user-select: none;
  }
  header { text-align: center; margin-top: 8px; }
  .orb {
    width: 92px; height: 92px; border-radius: 50%;
    margin: 0 auto 18px;
    background: radial-gradient(circle at 38% 32%, #fff7ea, #ffd9a8 45%, #f0a95e 100%);
    box-shadow: 0 0 60px rgba(255,200,130,0.35), 0 0 120px rgba(255,180,100,0.12);
    animation: breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 50px rgba(255,200,130,0.28), 0 0 110px rgba(255,180,100,0.10); }
    50% { box-shadow: 0 0 70px rgba(255,200,130,0.45), 0 0 140px rgba(255,180,100,0.18); }
  }
  h1 { font-size: 54px; font-weight: 800; letter-spacing: 1px; }
  .tagline { color: var(--dim); font-size: 15px; margin-top: 6px; letter-spacing: 0.4px; }

  main { display: flex; flex-direction: column; gap: 14px; margin-top: 34px; flex: 1; justify-content: center; }
  a.tile {
    display: flex; align-items: center; gap: 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 22px 22px;
    text-decoration: none; color: var(--text);
    transition: transform 0.12s ease, background 0.2s ease;
  }
  a.tile:active { transform: scale(0.97); background: rgba(255,255,255,0.08); }
  a.tile.primary {
    background: linear-gradient(135deg, rgba(255,214,165,0.16), rgba(255,214,165,0.05));
    border-color: rgba(255,214,165,0.28);
  }
  .tile .glyph { font-size: 30px; width: 44px; text-align: center; flex-shrink: 0; }
  .tile .t { font-size: 19px; font-weight: 650; }
  .tile .c { font-size: 13px; color: var(--dim); margin-top: 3px; }
  a.tile.primary .t { color: var(--accent); }

  footer { text-align: center; color: var(--dim); font-size: 12px; letter-spacing: 0.5px; margin-top: 26px; opacity: 0.8; }
</style>
</head>
<body>
  <header>
    <div class="orb"></div>

    <div class="tagline">your ipad, my screen</div>
  </header>
  <main>
    <a class="tile primary" href="sms:+14153129552&amp;body=hey%20fo">
      <span class="glyph">&#128172;</span>
      <span><span class="t">Chat with Fo</span><br><span class="c">opens messages, signed in as fo</span></span>
    </a>
    <a class="tile" href="https://wajo.ai">

    </a>
    <a class="tile" href="https://www.tiktok.com/@eddyexplains">
      <span class="glyph">&#127916;</span>
      <span><span class="t">Daily facts</span><br><span class="c">today's video lives here</span></span>
    </a>
  </main>
  <footer>this ipad only talks to fo</footer>
</body>
</html>
